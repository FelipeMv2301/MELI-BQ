{% load static %}
<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MELI-BQ{% endblock %}</title>

  <link rel="icon" type="image/svg+xml" href="{% static 'images/icono.svg' %}">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <style>
    /* Mismos tokens de gestorBQ (bioquimica.cl) — identidad visual compartida entre los
       portales internos. Claro/oscuro vía clase .dark en <html>, persistido en localStorage. */
    :root {
      --appbg:#edf4f4; --surface:#ffffff; --field:#ffffff; --line:#dbe8e8; --linestrong:#c6d8d8;
      --body:#1c2b2d; --muted:#5f7476; --ink:#12262a;
      --brand:#0b8f9c; --brand-ink:#076370; --brand-soft:#dbf1f2;
      --pend-bg:#fdefdd; --pend-ink:#965310; --pend-dot:#ef8f2a;
      --apro-bg:#dbf1f2; --apro-ink:#076370; --apro-dot:#0b8f9c;
      --rech-bg:#fbe4e2; --rech-ink:#8c261d; --rech-dot:#e0463a;
    }
    .dark {
      --appbg:#0e1417; --surface:#161c21; --field:#1c242a; --line:#29323a; --linestrong:#3a454e;
      --body:#dfe7ec; --muted:#93a1ab; --ink:#eef4f6;
      --brand:#2cbae2; --brand-ink:#8bdcef; --brand-soft:#0c2c34;
      --pend-bg:#352a12; --pend-ink:#f0b46a; --pend-dot:#ef8f2a;
      --apro-bg:#0c2c34; --apro-ink:#6fd2dd; --apro-dot:#2cbae2;
      --rech-bg:#351512; --rech-ink:#ef8579; --rech-dot:#e0463a;
    }
  </style>
  <script>
    (function () {
      if (localStorage.getItem('tema') === 'dark') document.documentElement.classList.add('dark');
    })();
  </script>
  <script src="{% static 'vendor/htmx-2.0.4.min.js' %}" defer></script>
  <script>
    window.alternarTema = function () {
      var oscuro = document.documentElement.classList.toggle('dark');
      localStorage.setItem('tema', oscuro ? 'dark' : 'claro');
    };

    // Django exige el header X-CSRFToken en cada POST — htmx no lo manda solo, hay que leerlo
    // de la cookie que ya pone CsrfViewMiddleware (mismo patrón documentado por htmx+Django).
    document.addEventListener('htmx:configRequest', function (event) {
      var match = document.cookie.match('(^|;)\\s*csrftoken\\s*=\\s*([^;]+)');
      if (match) event.detail.headers['X-CSRFToken'] = match.pop();
    });

    // HU-CM1.3 — solo pide confirmación si la acción masiva afecta a más de 50 productos
    // (hx-confirm por sí solo confirmaría siempre, sin importar cuántos estén seleccionados).
    document.addEventListener('htmx:confirm', function (event) {
      if (!event.detail.elt.classList.contains('accion-masiva')) return;
      var seleccionados = document.querySelectorAll("input[name='skus']:checked").length;
      if (seleccionados <= 50) return;
      event.preventDefault();
      if (confirm('¿Aplicar a los ' + seleccionados + ' productos seleccionados?')) {
        event.detail.issueRequest();
      }
    });
  </script>
</head>
<body class="min-h-screen bg-appbg text-body font-sans antialiased">
  {% if user.is_authenticated %}
  <header class="sticky top-0 z-40 flex items-center gap-5 px-6 py-2.5 bg-surface border-b border-line">
    <a href="{% url 'catalogo_ml:index' %}" class="flex items-center gap-2 shrink-0">
      <img src="{% static 'images/logo.png' %}"        alt="bioquimica.cl" class="h-8 block dark:hidden">
      <img src="{% static 'images/logo_blanco.png' %}" alt="bioquimica.cl" class="h-9 hidden dark:block">
      <strong class="text-ink">MELI-BQ</strong>
    </a>

    <nav class="flex gap-1">
      <a href="{% url 'catalogo_ml:index' %}"
         class="text-sm font-semibold text-muted hover:text-body hover:bg-appbg px-3 py-2 rounded-lg">Catálogo</a>
      <a href="{% url 'facturacion_ml:index' %}"
         class="text-sm font-semibold text-muted hover:text-body hover:bg-appbg px-3 py-2 rounded-lg">Facturación</a>
    </nav>

    <span class="flex-1"></span>

    <button onclick="alternarTema()" title="Modo claro / oscuro" aria-label="Modo claro/oscuro"
            class="w-9 h-9 rounded-lg border border-line grid place-items-center text-muted hover:text-body">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>

    <div class="flex items-center gap-3">
      <span class="w-9 h-9 rounded-full bg-brand text-white grid place-items-center font-bold text-xs">{{ user.email|first|upper }}</span>
      <a href="{% url 'account_logout' %}"
         class="text-sm font-semibold text-brand-ink hover:bg-brand-soft px-3 py-2 rounded-lg">Salir</a>
    </div>
  </header>
  {% endif %}

  <main class="max-w-6xl w-full mx-auto px-6 pt-7 pb-16">
    {% block content %}{% endblock %}
  </main>

  <div id="toasts" class="fixed top-[70px] right-5 z-[60] flex flex-col gap-2.5"></div>
  {% include "partials/_toast.html" %}
</body>
</html>
